<script>
(function () {

  /*
   * Callback Form
   *
   * Browser sends ONE request to:
   * /.netlify/functions/submit-lead
   *
   * Netlify function then handles:
   * 1. CRM
   * 2. A/B/C qualification
   * 3. Google Sheet fallback if CRM fails
   */

  var SUBMIT_URL = '/.netlify/functions/submit-lead';

  var els = {
    welcome: document.getElementById('welcome'),
    form: document.getElementById('form'),
    done: document.getElementById('done'),
    responses: document.getElementById('responses'),
    bar: document.getElementById('bar'),
    progress: document.getElementById('progress'),
    back: document.getElementById('back')
  };

  var steps = Array.prototype.slice.call(
    document.querySelectorAll('[data-step]')
  );

  var fields = [
    'f-name',
    'f-phone',
    'f-income',
    'f-worth',
    'f-services'
  ].map(function (id) {
    return document.getElementById(id);
  });

  var errs = [
    'e-name',
    'e-phone',
    'e-income',
    'e-worth',
    'e-services'
  ].map(function (id) {
    return document.getElementById(id);
  });

  var cur = -1;
  var sending = false;

  /*
   * Validation
   */

  var checks = [

    // Name
    function (v) {
      return v.trim().length >= 2
        ? ''
        : 'Please enter your name.';
    },

    // Phone
    function (v) {

      var digits = v.replace(/\D/g, '');

      if (
        !/^[+\d][\d\s\-()]*$/.test(v.trim()) ||
        digits.length < 7 ||
        digits.length > 15
      ) {
        return 'Please enter a valid phone number, for example +91 98450 00000.';
      }

      return '';
    },

    // Income
    function (v) {
      return v
        ? ''
        : 'Please choose one option.';
    },

    // Net Worth
    function (v) {
      return v
        ? ''
        : 'Please choose one option.';
    },

    // Services
    function (v) {
      return v.trim().length >= 3
        ? ''
        : 'Please tell us what you expect from us.';
    }

  ];

  /*
   * Progress bar
   */

  function setProgress(i) {

    var pct =
      i < 0
        ? 0
        : Math.round(
            (i / steps.length) * 100
          );

    els.bar.style.width =
      pct + '%';

    els.progress.setAttribute(
      'aria-valuenow',
      String(pct)
    );
  }

  /*
   * Show question
   */

  function showStep(i, dir) {

    cur = i;

    els.welcome.hidden = true;
    els.done.hidden = true;

    if (els.responses) {
      els.responses.hidden = true;
    }

    els.form.hidden = false;

    steps.forEach(
      function (s, k) {
        s.hidden = k !== i;
      }
    );

    els.back.hidden =
      i === 0;

    setProgress(i);

    var f = fields[i];

    var opts =
      steps[i].querySelectorAll(
        '.opt'
      );

    /*
     * Radio-style options
     */

    if (opts.length) {

      var pick =
        steps[i].querySelector(
          '.opt[aria-checked="true"]'
        ) || opts[0];

      try {
        pick.focus({
          preventScroll: true
        });
      } catch (e) {
        pick.focus();
      }

      return;
    }

    /*
     * Text fields
     */

    try {
      f.focus({
        preventScroll: true
      });
    } catch (e) {
      f.focus();
    }

    if (
      f.setSelectionRange &&
      f.type === 'text' &&
      dir === 'back'
    ) {

      var len =
        f.value.length;

      f.setSelectionRange(
        len,
        len
      );
    }
  }

  /*
   * Show only one screen
   */

  function showOnly(el) {

    els.welcome.hidden = true;
    els.form.hidden = true;
    els.done.hidden = true;

    if (els.responses) {
      els.responses.hidden = true;
    }

    el.hidden = false;

    els.back.hidden = true;

    try {
      el.focus({
        preventScroll: true
      });
    } catch (e) {}
  }

  /*
   * Validate question
   */

  function validate(i) {

    var msg =
      checks[i](
        fields[i].value
      );

    errs[i].textContent =
      msg;

    if (msg) {

      fields[i].setAttribute(
        'aria-invalid',
        'true'
      );

    } else {

      fields[i].removeAttribute(
        'aria-invalid'
      );
    }

    return !msg;
  }

  /*
   * Next question
   */

  function next() {

    if (
      sending ||
      cur < 0
    ) {
      return;
    }

    if (!validate(cur)) {

      var option =
        steps[cur].querySelector(
          '.opt'
        );

      (
        option ||
        fields[cur]
      ).focus();

      return;
    }

    if (
      cur <
      steps.length - 1
    ) {

      showStep(
        cur + 1,
        'fwd'
      );

    } else {

      submit();
    }
  }

  /*
   * Collect form data
   */

  function values() {

    return {

      name:
        fields[0]
          .value
          .trim(),

      phone:
        fields[1]
          .value
          .trim(),

      income:
        fields[2]
          .value,

      worth:
        fields[3]
          .value,

      services:
        fields[4]
          .value
          .trim()
    };
  }

  /*
   * Thank-you page
   */

  function thanks() {

    els.bar.style.width =
      '100%';

    els.progress.setAttribute(
      'aria-valuenow',
      '100'
    );

    showOnly(
      els.done
    );
  }

  /*
   * SUBMIT
   *
   * Sends to Netlify Function.
   *
   * The function handles:
   *
   * CRM
   * Supabase
   * A/B/C lead grade
   * Google Sheet fallback
   */

  async function submit() {

    var v =
      values();

    var btn =
      document.getElementById(
        'submit'
      );

    var trap =
      document.querySelector(
        'input[name="bot-field"]'
      );

    sending = true;

    btn.disabled = true;

    btn.textContent =
      'Sending…';

    /*
     * Remove any previous error
     */

    errs[cur].textContent =
      '';

    try {

      var response =
        await fetch(
          SUBMIT_URL,
          {
            method: 'POST',

            headers: {
              'Content-Type':
                'application/json'
            },

            body:
              JSON.stringify({

                name:
                  v.name,

                phone:
                  v.phone,

                income:
                  v.income,

                worth:
                  v.worth,

                services:
                  v.services,

                'bot-field':
                  trap
                    ? trap.value
                    : ''
              })
          }
        );

      /*
       * Try reading server response
       */

      var result = {};

      try {

        result =
          await response.json();

      } catch (e) {

        result = {};
      }

      /*
       * Submission successful
       */

      if (
        response.ok &&
        result.success === true
      ) {

        console.log(
          'Lead submitted successfully',
          {
            destination:
              result.destination ||
              'unknown',

            lead_grade:
              result.lead_grade ||
              null
          }
        );

        thanks();

        return;
      }

      /*
       * Server rejected submission
       */

      throw new Error(
        result.message ||
        'Submission failed'
      );

    } catch (error) {

      console.error(
        'Lead submission failed',
        error
      );

      errs[cur].textContent =
        'We could not send your response. Please try again.';

      try {

        fields[cur].focus();

      } catch (e) {}

    } finally {

      sending = false;

      btn.disabled = false;

      btn.textContent =
        'Submit';
    }
  }

  /*
   * START BUTTON
   */

  document
    .getElementById('start')
    .addEventListener(
      'click',
      function () {

        showStep(
          0,
          'fwd'
        );
      }
    );

  /*
   * NEXT BUTTONS
   */

  steps.forEach(
    function (s) {

      s.querySelector(
        '[data-next]'
      ).addEventListener(
        'click',
        next
      );
    }
  );

  /*
   * BACK BUTTON
   */

  els.back.addEventListener(
    'click',
    function () {

      if (cur > 0) {

        showStep(
          cur - 1,
          'back'
        );
      }
    }
  );

  /*
   * Input fields
   */

  fields.forEach(
    function (f, i) {

      f.addEventListener(
        'input',
        function () {

          if (
            f.getAttribute(
              'aria-invalid'
            )
          ) {

            validate(i);
          }
        }
      );

      f.addEventListener(
        'keydown',
        function (e) {

          if (
            e.key !== 'Enter' ||
            e.isComposing
          ) {
            return;
          }

          /*
           * Shift + Enter
           * creates new line
           * in textarea.
           */

          if (
            f.tagName ===
              'TEXTAREA' &&
            e.shiftKey
          ) {
            return;
          }

          e.preventDefault();

          next();
        }
      );
    }
  );

  /*
   * Multiple-choice buttons
   */

  steps.forEach(
    function (s, i) {

      var opts =
        Array.prototype.slice.call(
          s.querySelectorAll(
            '.opt'
          )
        );

      if (!opts.length) {
        return;
      }

      function choose(btn) {

        opts.forEach(
          function (o) {

            o.setAttribute(
              'aria-checked',

              o === btn
                ? 'true'
                : 'false'
            );
          }
        );

        fields[i].value =
          btn.getAttribute(
            'data-value'
          );

        validate(i);
      }

      opts.forEach(
        function (btn, k) {

          /*
           * Mouse / touch selection
           */

          btn.addEventListener(
            'click',
            function () {

              choose(btn);

              setTimeout(
                function () {

                  if (
                    cur === i
                  ) {

                    next();
                  }
                },
                250
              );
            }
          );

          /*
           * Keyboard controls
           */

          btn.addEventListener(
            'keydown',
            function (e) {

              if (
                e.key ===
                  'ArrowDown' ||
                e.key ===
                  'ArrowRight'
              ) {

                e.preventDefault();

                opts[
                  (k + 1) %
                    opts.length
                ].focus();

              } else if (
                e.key ===
                  'ArrowUp' ||
                e.key ===
                  'ArrowLeft'
              ) {

                e.preventDefault();

                opts[
                  (
                    k -
                    1 +
                    opts.length
                  ) %
                    opts.length
                ].focus();

              } else {

                /*
                 * A / B / C / D
                 * keyboard shortcut
                 */

                var idx =
                  e.key.length === 1
                    ? e.key
                        .toUpperCase()
                        .charCodeAt(0) -
                      65
                    : -1;

                if (
                  idx >= 0 &&
                  idx <
                    opts.length
                ) {

                  e.preventDefault();

                  opts[idx].focus();

                  opts[idx].click();
                }
              }
            }
          );
        }
      );
    }
  );

  /*
   * Enter key on welcome screen
   */

  document.addEventListener(
    'keydown',
    function (e) {

      if (
        e.key === 'Enter' &&
        cur === -1 &&
        !els.welcome.hidden &&
        document.activeElement ===
          document.body
      ) {

        showStep(
          0,
          'fwd'
        );
      }
    }
  );

  /*
   * Initial state
   */

  setProgress(-1);

})();
</script>
